name: "Experimental Release"

concurrency: experimental-release

on:
  # Upstream rebuilds this on every push to main.  A personal fork does not want an
  # hour of multi-platform builds standing behind every commit, so it is run on
  # demand instead.  Restore the push trigger below to get the upstream behaviour.
  # push:
  #   branches:
  #     - main
  #   paths-ignore: [docs/**, scripts/**, "**.md", "**.mdx"]
  workflow_dispatch:

# The repository's default token is read-only.  Creating a release and uploading
# its assets both need write access to contents, so ask for it explicitly rather
# than loosening the default for every workflow.
permissions:
  contents: write

jobs:
  build-translations:
    uses: ./.github/workflows/build-translations.yml
    secrets:
      TX_TOKEN: ${{ secrets.TX_TOKEN }}

  builds:
    needs: build-translations
    uses: ./.github/workflows/build.yml
    with:
      version-label: experimental
      upload-to-release: true
    secrets: inherit
